name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # Bước 1: Chạy kiểm thử tự động toàn diện trước khi deploy
  ci:
    name: Run CI Checks Before Deploy
    uses: ./.github/workflows/ci.yml

  # Bước 2: Chỉ deploy khi job CI pass thành công (needs: [ci])
  deploy:
    name: SSH Deploy to EC2
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 5m
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/salon-root
            
            echo "=== KIỂM TRA DUNG LƯỢNG ĐĨA TRƯỚC DEPLOY ==="
            df -h /
            df -ih /
            sudo docker system df
            
            # Trích xuất dung lượng trống khả dụng (cột Available của phân vùng /)
            AVAIL_KB=$(df / | awk 'NR==2 {print $4}')
            AVAIL_GB=$(( AVAIL_KB / 1024 / 1024 ))
            echo "Dung lượng đĩa trống khả dụng: ${AVAIL_GB} GB"
            
            if [ "$AVAIL_GB" -lt 2 ]; then
              echo "================================================================="
              echo "CẢNH BÁO CỰC KỲ QUAN TRỌNG:"
              echo "Dung lượng đĩa khả dụng của máy chủ rất thấp (dưới 2GB)!"
              echo "Hiện tại chỉ còn lại ${AVAIL_GB} GB trống."
            fi
            
            # Sửa quyền sở hữu thư mục về ubuntu:ubuntu
            sudo chown -R ubuntu:ubuntu .
            
            # Xóa các file lock Git bị kẹt nếu có
            rm -f .git/index.lock .git/ORIG_HEAD.lock .git/HEAD.lock
            
            # 2. Fetch và reset cứng về origin/main để lấy mã nguồn sạch từ GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Dọn dẹp dung lượng đĩa an toàn TRƯỚC khi build
            echo "=== TIẾN HÀNH DỌN DẸP DUNG LƯỢNG AN TOÀN TRƯỚC BUILD ==="
            sudo docker builder prune -f
            sudo docker image prune -f
            sudo docker container prune -f
            sudo docker network prune -f
            sudo journalctl --vacuum-time=3d || true
            sudo apt-get clean || true
            
            # 4. Build image mới TRƯỚC để tránh downtime (Không dừng container cũ trước)
            echo "=== BIÊN DỊCH DOCKER IMAGES MỚI (KHÔNG CÓ DOWNTIME) ==="
            sudo docker compose build
            
            # 5. Nếu build thành công, restart container để áp dụng code mới
            echo "=== KHỞI CHẠY CONTAINER MỚI THAY THẾ ==="
            sudo docker compose up -d --remove-orphans
            
            # 6. TỰ ĐỘNG HEALTH CHECK SAU KHI DEPLOY
            echo "=== KIỂM TRA HEALTH CHECK HỆ THỐNG SAU DEPLOY ==="
            sleep 5
            HEALTHY=false
            for i in {1..10}; do
              API_OK=false
              FE_OK=false

              if curl -sf http://127.0.0.1:5000/api/health > /dev/null 2>&1; then
                API_OK=true
              fi

              if curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
                FE_OK=true
              fi

              if [ "$API_OK" = true ] && [ "$FE_OK" = true ]; then
                echo "✅ Toàn bộ hệ thống (Backend :5000 & Frontend :8080) đã sẵn sàng hoạt động!"
                HEALTHY=true
                break
              fi

              echo "Đang chờ container khởi động... ($i/10)"
              sleep 3
            done

            if [ "$HEALTHY" != true ]; then
              echo "❌ CẢNH BÁO: Hệ thống không phản hồi sau khi deploy!"
              echo "=== TRẠNG THÁI CONTAINERS ==="
              sudo docker compose ps
              echo "=== LOGS BACKEND GẦN NHẤT ==="
              sudo docker compose logs --tail=30 api
              exit 1
            fi
            
            # 7. Dọn dẹp đĩa nhẹ sau khi deploy thành công
            echo "=== DỌN DẸP LẠI SAU KHI DEPLOY THÀNH CÔNG ==="
            sudo docker image prune -f
            echo "🚀 TRIỂN KHAI VÀ HEALTH CHECK THÀNH CÔNG HOÀN TẤT!"
