
name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1. Chạy CI trước khi triển khai
  ci:
    name: Run CI Before Deploy
    uses: ./.github/workflows/ci.yml

  # 2. Chỉ Deploy nếu CI thành công
  deploy:
    name: Deploy to AWS EC2
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        env:
          DEPLOY_SHA: ${{ github.sha }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 5m
          command_timeout: 20m
          envs: DEPLOY_SHA

          script: |
            set -eu

            cd /home/ubuntu/salon-root

            echo "===== CHECK ENVIRONMENT ====="

            if [ ! -f .env ]; then
              echo "ERROR: Production .env file not found!"
              exit 1
            fi

            echo "Production .env exists."

            echo "===== DOCKER DISK USAGE ====="
            sudo docker system df

            # Dọn build cache cũ hơn 7 ngày
            sudo docker builder prune -f --filter "until=168h"

            # Chỉ xóa dangling images
            sudo docker image prune -f

            echo "===== CHECK DISK SPACE ====="

            df -h /
            df -ih /

            AVAIL_KB=$(df -Pk / | awk 'NR==2 {print $4}')
            MIN_FREE_KB=$((5 * 1024 * 1024))

            if [ "$AVAIL_KB" -lt "$MIN_FREE_KB" ]; then
              echo "ERROR: Less than 5GB disk space available."
              echo "Deployment aborted."
              exit 1
            fi

            INODE_PCT=$(df -Pi / | awk 'NR==2 {gsub("%","",$5); print $5}')

            if [ "$INODE_PCT" -ge 95 ]; then
              echo "ERROR: Inode usage is at least 95%."
              exit 1
            fi

            echo "===== PREPARE SOURCE CODE ====="

            PREVIOUS_SHA=$(git rev-parse HEAD)

            git fetch origin main

            if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              echo "ERROR: Requested deployment commit not found."
              exit 1
            fi

            # Deploy đúng commit đã được CI kiểm tra
            git reset --hard "$DEPLOY_SHA"

            echo "Deploying commit: $DEPLOY_SHA"
            echo "Previous commit: $PREVIOUS_SHA"

            echo "===== VALIDATE DOCKER COMPOSE ====="

            sudo docker compose config --quiet

            echo "===== BUILD NEW DOCKER IMAGES ====="

            sudo docker compose build

            # Hàm rollback về phiên bản trước
            rollback() {
              echo "===== START ROLLBACK ====="

              if [ "$PREVIOUS_SHA" = "$DEPLOY_SHA" ]; then
                echo "No previous version available for rollback."
                return 1
              fi

              git reset --hard "$PREVIOUS_SHA" || return 1

              sudo docker compose build || return 1

              sudo docker compose up -d --remove-orphans || return 1

              sudo docker compose ps

              echo "Rollback completed."
            }

            echo "===== START NEW CONTAINERS ====="

            if ! sudo docker compose up -d --remove-orphans; then
              echo "ERROR: Docker Compose deployment failed."

              rollback || echo "WARNING: Rollback could not be completed."

              exit 1
            fi

            echo "===== APPLICATION HEALTH CHECK ====="

            API_OK=0
            FRONTEND_OK=0

            # Kiểm tra API và Frontend tối đa 150 giây
            for attempt in $(seq 1 30); do

              if curl -fsS --max-time 5 \
                http://127.0.0.1:5000/api/health >/dev/null; then
                API_OK=1
              fi

              if curl -fsS --max-time 5 \
                http://127.0.0.1:8080/ >/dev/null; then
                FRONTEND_OK=1
              fi

              if [ "$API_OK" -eq 1 ] && [ "$FRONTEND_OK" -eq 1 ]; then
                break
              fi

              echo "Waiting for application... ($attempt/30)"
              sleep 5
            done

            if [ "$API_OK" -ne 1 ] || [ "$FRONTEND_OK" -ne 1 ]; then

              echo "ERROR: Application health check failed."

              sudo docker compose ps || true

              sudo docker compose logs --tail=50 || true

              rollback || echo "WARNING: Rollback could not be completed."

              exit 1
            fi

            echo "===== DEPLOYMENT SUCCESSFUL ====="

            sudo docker compose ps

            sudo docker image prune -f

            echo "===== FINAL DISK STATUS ====="

            df -h /
