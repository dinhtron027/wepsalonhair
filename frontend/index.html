<!DOCTYPE html>
<!-- 
  Tệp index.html: Điểm khởi đầu (Entry Point) của ứng dụng Single Page Application (SPA).
  Trình duyệt tải file này đầu tiên, sau đó nạp file /src/main.tsx để React render toàn bộ giao diện.
-->
<html lang="vi">
  <head>
    <!-- Thiết lập bảng mã UTF-8 hỗ trợ đầy đủ tiếng Việt có dấu -->
    <meta charset="UTF-8" />
    <!-- Viewport responsive: Đảm bảo tỷ lệ co giãn 1:1 chuẩn xác trên màn hình di động, máy tính bảng -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ================= THẺ META PHỤC VỤ SEO TÌM KIẾM ================= -->
    <title>Salon Dương Chi — Cắt, Uốn, Nhuộm & Chăm Sóc Tóc Chuyên Nghiệp tại Lộc Ninh</title>
    <!-- Thẻ meta description tóm tắt nội dung khi tìm kiếm trên Google -->
    <meta
      name="description"
      content="Salon Dương Chi cung cấp dịch vụ cắt, uốn, nhuộm, duỗi, phục hồi tóc và gội đầu dưỡng sinh cao cấp tại Lộc Ninh, Bình Phước. Đặt lịch ngay hôm nay!"
    />
    <!-- Cho phép bot tìm kiếm index (đánh chỉ mục) và follow (thu thập các liên kết trong trang) -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL: Định danh đường dẫn gốc của website, tránh bị Google phạt lỗi trùng lặp nội dung -->
    <link rel="canonical" href="https://salonduongchi.website/" />

    <!-- ================= OPEN GRAPH PROTOCOL (CHIA SẺ LÊN FACEBOOK/ZALO) ================= -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://salonduongchi.website/" />
    <meta property="og:site_name" content="Salon Dương Chi" />
    <meta property="og:title" content="Salon Dương Chi — Cắt, Uốn, Nhuộm & Chăm Sóc Tóc Chuyên Nghiệp" />
    <meta
      property="og:description"
      content="Salon Dương Chi cung cấp dịch vụ cắt, uốn, nhuộm, duỗi, phục hồi tóc và gội đầu dưỡng sinh cao cấp tại Lộc Ninh, Bình Phước. Đặt lịch ngay hôm nay!"
    />
    <meta property="og:image" content="https://salonduongchi.website/og-image.jpg" />
    <meta property="og:locale" content="vi_VN" />

    <!-- ================= TWITTER CARD METADATA ================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Salon Dương Chi — Cắt, Uốn, Nhuộm & Chăm Sóc Tóc Chuyên Nghiệp" />
    <meta
      name="twitter:description"
      content="Salon Dương Chi cung cấp dịch vụ cắt, uốn, nhuộm, duỗi, phục hồi tóc và gội đầu dưỡng sinh cao cấp tại Lộc Ninh, Bình Phước."
    />

    <!-- ================= BIỂU TƯỢNG (FAVICON & PWA MANIFEST) ================= -->
    <link rel="icon" type="image/x-icon" href="/favicon-v2.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v2-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-v2-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <!-- 
      Tối ưu hiệu năng tải Font (Web Vitals):
      - preconnect: Kết nối sớm bắt tay SSL với máy chủ font Google trước khi yêu cầu font cụ thể.
      - rel="preload": Tải trước file CSS font để tránh hiện tượng chặn render (render-blocking).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <!-- Fallback cho trình duyệt tắt Javascript vẫn nạp được font bình thường -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      />
    </noscript>

    <!-- 
      Tối ưu chỉ số LCP (Largest Contentful Paint):
      Tải trước hình ảnh Banner chính của trang chủ với mức ưu tiên cao (fetchpriority="high")
      theo media query (ảnh nhỏ cho mobile, ảnh lớn cho desktop).
    -->
    <!-- Preload LCP hero image (mobile) -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=800&q=75&fm=webp"
      fetchpriority="high"
      media="(max-width: 767px)"
    />
    <!-- Preload LCP hero image (desktop) -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1200&q=80&fm=webp"
      fetchpriority="high"
      media="(min-width: 768px)"
    />
  </head>
  <body>
    <!-- 
      Phần tử DOM gốc: Nơi thư viện React DOM mount (gắn) toàn bộ cây component của ứng dụng.
    -->
    <div id="root"></div>

    <!-- 
      Nạp mã nguồn TypeScript/React bằng cơ chế ES Modules chuẩn hiện đại do Vite hỗ trợ.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
